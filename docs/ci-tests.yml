name: Tests del modelo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests determinísticos, estadísticos e integración
        run: python -m unittest discover -s tests -t . -v
      - name: Semana completa de ejemplo e invariantes
        run: python -m supermercado simular --config ejemplos/base.json --semilla 2026 --salida resultados/ci --sin-traza
