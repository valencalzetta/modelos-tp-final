[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "modelos-tp-final"
version = "0.1.0"
description = "Simulación de eventos discretos de cajas de supermercado"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
supermercado = "supermercado.__main__:main"

[tool.setuptools.packages.find]
include = ["supermercado*"]
